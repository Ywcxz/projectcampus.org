# Checks the landing page's rules on each pull request and on every push
# to main. The job is named "Site test" so it can be required on main.
name: Site test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Site test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the page's rules
        working-directory: tests
        run: npm test
